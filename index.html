<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的记账本</title>
  <style>
    body {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      font: 16px/1.6 sans-serif;
      color: #222;
      background: #f5f6fa;
    }

    main {
      padding: 24px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 16px #0001;
    }

    form {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }

    input, button {
      padding: 10px;
      font: inherit;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      color: #1677ff;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>我的记账本</h1>
    <p>本月支出：<span class="total">¥<span id="total">0.00</span></span></p>

    <form id="expense-form">
      <input id="item" type="text" placeholder="支出项目，例如：午餐" required>
      <input id="amount" type="number" placeholder="金额" min="0.01" step="0.01" required>
      <button type="submit">添加</button>
    </form>

    <h2>支出记录</h2>
    <ul id="records"></ul>
  </main>

  <script>
    const form = document.querySelector("#expense-form");
    const itemInput = document.querySelector("#item");
    const amountInput = document.querySelector("#amount");
    const records = document.querySelector("#records");
    const totalElement = document.querySelector("#total");

    let total = 0;

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const item = itemInput.value.trim();
      const amount = Number(amountInput.value);

      if (!item || amount <= 0) return;

      const row = document.createElement("li");
      const name = document.createElement("span");
      const price = document.createElement("span");

      name.textContent = item;
      price.textContent = `¥${amount.toFixed(2)}`;
      row.append(name, price);
      records.prepend(row);

      total += amount;
      totalElement.textContent = total.toFixed(2);
      form.reset();
      itemInput.focus();
    });
  </script>
</body>
</html>
